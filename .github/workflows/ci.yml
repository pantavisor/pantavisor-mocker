name: CI

# Build and test on every branch push and pull request. The release/publish
# pipeline in docker-publish.yml stays scoped to main/tags; this job just
# provides a fast build+test signal for development branches (mirrors the
# GitLab `test` job).
on:
  push:
  pull_request:

# Supersede in-flight runs of the same ref instead of queueing duplicates.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    # Same-repo branches already get a run from the push event; only run the
    # pull_request variant for forks, so PR commits aren't tested twice.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install libcurl development headers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libcurl4-openssl-dev

      - name: Install Zig 0.15.2
        run: |
          curl -fL https://ziglang.org/download/0.15.2/zig-x86_64-linux-0.15.2.tar.xz -o zig.tar.xz
          sudo tar -xJf zig.tar.xz --strip-components=1 -C /usr/local/bin
          rm zig.tar.xz
          zig version

      - name: Build (ReleaseSafe)
        run: zig build --release=safe -Doptimize=ReleaseSafe

      - name: Test
        run: zig build test

      - name: End-to-end tests (real binary)
        run: zig build e2e

  # macOS release targets: build natively and smoke-test the binary so a
  # Linux-only API slipping in fails here rather than at release time. The
  # unit/e2e suites stay Linux-only.
  build-macos:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    strategy:
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Zig 0.15.2
        run: |
          ZIG_ARCH=$([ "$(uname -m)" = arm64 ] && echo aarch64 || echo x86_64)
          curl -fL "https://ziglang.org/download/0.15.2/zig-${ZIG_ARCH}-macos-0.15.2.tar.xz" -o zig.tar.xz
          mkdir -p "$RUNNER_TEMP/zig" && tar -xJf zig.tar.xz --strip-components=1 -C "$RUNNER_TEMP/zig"
          rm zig.tar.xz
          echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/zig/zig" version

      - name: Build (ReleaseSafe)
        run: zig build --release=safe -Doptimize=ReleaseSafe

      - name: Smoke test
        run: |
          ./zig-out/bin/pantavisor-mocker version
          ./zig-out/bin/pantavisor-mocker config -o smoke/device.json -t TOKEN
          ./zig-out/bin/pantavisor-mocker init -s smoke/storage -c smoke/device.json
